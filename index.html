<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cangrejito Rewards | Tarjeta de Lealtad</title>
  <style>
    :root {
      --primary: #e88ca7;
      --primary-dark: #d46b89;
      --accent: #f7d6e0;
      --bg: #faf4f6;
      --card-bg: #ffffff;
      --text: #4a4a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(232, 140, 167, 0.15);
      padding: 24px;
      text-align: center;
      border: 1px solid var(--accent);
    }

    .brand-header h1 {
      font-size: 1.5rem;
      color: var(--primary-dark);
      letter-spacing: 1px;
    }

    .client-name-box {
      margin: 10px 0 18px 0;
    }

    .client-name-box h2 {
      font-size: 1.2rem;
      color: #333;
      font-weight: 600;
    }

    .client-name-box p {
      font-size: 0.8rem;
      color: #888;
    }

    .card-reward {
      background: var(--accent);
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 24px;
    }

    .stamps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stamp {
      aspect-ratio: 1;
      border: 2px dashed var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--primary);
      position: relative;
      transition: all 0.3s ease;
    }

    .stamp.active {
      background-color: var(--primary);
      border-style: solid;
      color: white;
      transform: scale(1.05);
    }

    .stamp.active::after {
      content: '💅';
      font-size: 1.4rem;
    }

    .stamp.active span {
      display: none;
    }

    .notification {
      display: none;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .notification.success {
      display: block;
      background-color: #d4edda;
      color: #155724;
    }

    .register-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 15px;
    }

    .register-box input {
      padding: 12px;
      border: 1px solid var(--primary);
      border-radius: 10px;
      font-size: 0.95rem;
      text-align: center;
      outline: none;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .btn-edit {
      background: transparent;
      border: none;
      color: #aaa;
      font-size: 0.75rem;
      cursor: pointer;
      text-decoration: underline;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-header">
      <h1>CANGREJITO REWARDS</h1>
    </div>

    <!-- PANTALLA DE REGISTRO -->
    <div id="registration-screen" style="display: none;">
      <div class="client-name-box">
        <p>¡Bienvenida/o! Ingresa tu nombre para activar tu tarjeta de cliente frecuente.</p>
      </div>
      <div class="register-box">
        <input type="text" id="input-name" placeholder="Tu Nombre y Apellido" maxlength="30">
        <button class="btn" onclick="registerUser()">Guardar mi Tarjeta</button>
      </div>
    </div>

    <!-- PANTALLA DE TARJETA PRINCIPAL -->
    <div id="card-screen" style="display: none;">
      <div class="client-name-box">
        <h2 id="client-name">Hola</h2>
        <p>Tarjeta del Cliente Frecuente</p>
      </div>

      <div id="alert-box" class="notification"></div>

      <div class="card-reward" id="reward-status">
        ¡Llena tu tarjeta y obtén tu premio!
      </div>

      <div class="stamps-grid" id="stamps-container"></div>

      <button class="btn-edit" onclick="editName()">¿Cambiar o editar nombre?</button>
    </div>
  </div>

  <script>
    const TOTAL_STAMPS = 6;
    const SECRET_KEY = "NAILS2026";
    
    // URL DE GOOGLE APPS SCRIPT
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwDsEYfdACplIwmeLF6WR3tVyMHp5N02CRsoCibxpXZiqHfxcPyaSIPKnakADIij_u2/exec";

    let clientName = localStorage.getItem('cangrejito_client_name');
    let currentStamps = parseInt(localStorage.getItem('cangrejito_stamps')) || 0;

    function initApp() {
      if (!clientName) {
        document.getElementById('registration-screen').style.display = 'block';
        document.getElementById('card-screen').style.display = 'none';
      } else {
        document.getElementById('registration-screen').style.display = 'none';
        document.getElementById('card-screen').style.display = 'block';
        document.getElementById('client-name').textContent = clientName;

        checkQRValidation();
        renderStamps();
      }
    }

    function registerUser() {
      const nameInput = document.getElementById('input-name').value.trim();
      if (nameInput === '') {
        alert('Por favor ingresa tu nombre');
        return;
      }
      clientName = nameInput;
      localStorage.setItem('cangrejito_client_name', clientName);
      localStorage.setItem('cangrejito_stamps', 0);
      currentStamps = 0;
      
      sendToGoogleSheets('Nuevo Registro', 0);
      
      initApp();
    }

    function checkQRValidation() {
      const urlParams = new URLSearchParams(window.location.search);
      const scannedSecret = urlParams.get('secret');

      if (scannedSecret === SECRET_KEY) {
        if (currentStamps < TOTAL_STAMPS) {
          currentStamps++;
          localStorage.setItem('cangrejito_stamps', currentStamps);
          showAlert('✨ ¡Sello añadido con éxito!');
          
          sendToGoogleSheets('Sello Añadido', currentStamps);
        } else {
          showAlert('¡Ya completaste todos tus sellos!');
        }

        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function sendToGoogleSheets(actionType, stampsCount) {
      if (!GOOGLE_SCRIPT_URL) return;

      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          clientName: clientName,
          action: actionType,
          stamps: stampsCount
        })
      }).catch(err => console.log('Error enviando datos:', err));
    }

    function showAlert(message) {
      const alertBox = document.getElementById('alert-box');
      alertBox.textContent = message;
      alertBox.classList.add('success');
      setTimeout(() => {
        alertBox.classList.remove('success');
      }, 4000);
    }

    function renderStamps() {
      const container = document.getElementById('stamps-container');
      const rewardStatus = document.getElementById('reward-status');
      container.innerHTML = '';

      for (let i = 1; i <= TOTAL_STAMPS; i++) {
        const stamp = document.createElement('div');
        stamp.classList.add('stamp');
        if (i <= currentStamps) {
          stamp.classList.add('active');
        } else {
          stamp.innerHTML = `<span>${i}</span>`;
        }
        container.appendChild(stamp);
      }

      if (currentStamps >= TOTAL_STAMPS) {
        rewardStatus.textContent = '🎉 ¡Felicidades! Tienes tu premio listo.';
        rewardStatus.style.background = '#d4edda';
        rewardStatus.style.color = '#155724';
      } else {
        rewardStatus.textContent = `Te faltan ${TOTAL_STAMPS - currentStamps} visita(s) para tu premio.`;
        rewardStatus.style.background = 'var(--accent)';
        rewardStatus.style.color = 'var(--primary-dark)';
      }
    }

    function editName() {
      const newName = prompt('Ingresa tu nombre actualizado:', clientName);
      if (newName && newName.trim() !== '') {
        clientName = newName.trim();
        localStorage.setItem('cangrejito_client_name', clientName);
        document.getElementById('client-name').textContent = clientName;
        sendToGoogleSheets('Nombre Actualizado', currentStamps);
      }
    }

    initApp();
  </script>
</body>
</html>
